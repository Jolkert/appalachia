[package]
name = "appalachia"
version = "0.2.8"
authors = ["jolkert"]
edition = "2024"
description = "a discord bot for personal use"
homepage = "https://jolkert.dev/appalachia"
repository = "https://github.com/jolkert/appalachia"
license = "MIT OR Apache-2.0"
exclude = ["bacon.toml", ".vscode/", "CHANGELOG.md"]
categories = ["command-line-utilities"]
keywords = ["discord", "bot", "appalachia", "rock-paper-scissors", "dice"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "6.0.0"
dotenv = "0.15.0"
env_logger = "0.11.3"
futures = "0.3.30"
log = "0.4.21"
palette = "0.7.6"
poise = "0.6.1"
rand = "0.9.2"
saikoro = { version = "1.2.2", features = ["stats"] }
serde = "1.0.201"
strum = "0.27.2"
strum_macros = "0.27.2"
tap = "1.0.1"
thiserror = "2.0.17"
tokio = { version = "1.35.1", features = ["full"] }
toml = "0.9.7"
unidecode = "0.3.0"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
same_name_method = "warn"
lossy_float_literal = "warn"

# we're not writing library code here. i don't really care all that much
missing_const_for_fn = { level = "allow", priority = 127 }
